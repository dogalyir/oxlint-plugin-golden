name: Project checks
description: Run the repository verification gate (install, check, pack dry-run)
runs:
  using: composite
  steps:
    - name: Install dependencies (frozen)
      run: bun install --frozen-lockfile
      shell: bash
    - name: Typecheck, lint, and test
      run: bun run check
      shell: bash
    - name: Verify the publishable tarball (prepack builds dist)
      run: npm pack --dry-run
      shell: bash
